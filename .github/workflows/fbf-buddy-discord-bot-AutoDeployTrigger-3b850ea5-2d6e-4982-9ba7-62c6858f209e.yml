name: Deploy Discord bot to App Service

on:
  push:
    branches:
      - main
    paths:
      - 'services/discord-bot/**'
      - '.github/workflows/fbf-buddy-discord-bot-AutoDeployTrigger-3b850ea5-2d6e-4982-9ba7-62c6858f209e.yml'
  workflow_dispatch:

env:
  ACR_NAME: fbfregistry
  APP_NAME: discord-buddy
  CONTAINER_NAME: discord-buddy
  IDENTITY_NAME: key-master
  IMAGE_NAME: fbf-buddy-discord-bot
  RESOURCE_GROUP: peter-corp-rg

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.FBFBUDDYDISCORDBOT_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.FBFBUDDYDISCORDBOT_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.FBFBUDDYDISCORDBOT_AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: |
          echo "${{ secrets.FBFBUDDYDISCORDBOT_REGISTRY_PASSWORD }}" |
            docker login "$ACR_NAME.azurecr.io" \
              --username "${{ secrets.FBFBUDDYDISCORDBOT_REGISTRY_USERNAME }}" \
              --password-stdin

      - name: Build and push image
        run: |
          IMAGE="$ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}"
          docker build --file services/discord-bot/Dockerfile --tag "$IMAGE" services/discord-bot
          docker push "$IMAGE"

      - name: Deploy image to App Service
        run: |
          SUBSCRIPTION_ID=$(az account show --query id --output tsv)
          IDENTITY_CLIENT_ID=$(az identity show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$IDENTITY_NAME" \
            --query clientId \
            --output tsv)
          IMAGE="$ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}"
          BODY=$(jq -n \
            --arg image "$IMAGE" \
            --arg identityClientId "$IDENTITY_CLIENT_ID" \
            '{
              properties: {
                image: $image,
                isMain: true,
                targetPort: "3001",
                authType: "UserAssigned",
                userManagedIdentityClientId: $identityClientId,
                inheritAppSettingsAndConnectionStrings: true
              }
            }')

          az rest \
            --method put \
            --url "https://management.azure.com/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.Web/sites/$APP_NAME/sitecontainers/$CONTAINER_NAME?api-version=2024-11-01" \
            --body "$BODY" \
            --output none

          HOST_NAME=$(az webapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --query defaultHostName \
            --output tsv)
          sleep 30
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "https://$HOST_NAME/ready"; then
              exit 0
            fi
            echo "Waiting for $APP_NAME to become ready (attempt $attempt/30)"
            sleep 10
          done
          exit 1
