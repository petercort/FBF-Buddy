name: Build and Push Docker Image

on:
  workflow_dispatch:
      
env:
  ACR_NAME: fbfregistry
  DISCORD_BOT_IMAGE_NAME: fbf-buddy-discord-bot
  BACKEND_IMAGE_NAME: fbf-buddy-backend
  RESOURCE_GROUP: peter-corp-rg
  DISCORD_BOT_APP: discord-buddy
  BACKEND_APP: fbf-events
  IDENTITY_NAME: key-master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.increment-version.outputs.NEW_VERSION }}
      discord-bot-image: ${{ steps.push-discord-bot.outputs.IMAGE_ID }}
      backend-image: ${{ steps.push-backend.outputs.IMAGE_ID }}
    steps:
    - name: checkout 
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    
    - name: Get previous version and increment
      id: increment-version
      run: |
        # Get the latest git tag that matches a version pattern
        if PREV_VERSION=$(git describe --tags --match="[0-9]*.[0-9]*.[0-9]*" --abbrev=0 HEAD 2>/dev/null); then
          echo "Previous version: $PREV_VERSION"
        else
          PREV_VERSION="0.0.0"
          echo "No previous version found, starting from: $PREV_VERSION"
        fi
        
        # Parse version components
        IFS='.' read -r MAJOR MINOR PATCH <<< "$PREV_VERSION"
        
        # Increment patch version
        PATCH=$((PATCH + 1))
        
        # Create new version
        NEW_VERSION="$MAJOR.$MINOR.$PATCH"
        echo "New version: $NEW_VERSION"
        echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
    
    - name: Update version files
      run: |
        NEW_VERSION=${{ steps.increment-version.outputs.NEW_VERSION }}
        
        # Update root package.json
        sed -i 's/"version": "[^"]*"/"version": "'$NEW_VERSION'"/' package.json
        
        # Update services/backend/package.json
        sed -i 's/"version": "[^"]*"/"version": "'$NEW_VERSION'"/' services/backend/package.json
        
        # Update services/discord-bot/package.json
        sed -i 's/"version": "[^"]*"/"version": "'$NEW_VERSION'"/' services/discord-bot/package.json
        
        # Update app.version
        echo "$NEW_VERSION" > app.version
        
        echo "Updated all package.json files and app.version to version $NEW_VERSION"
    
    - name: Commit version updates
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add package.json services/backend/package.json services/discord-bot/package.json app.version
        git commit -m "chore: bump version to ${{ steps.increment-version.outputs.NEW_VERSION }} [skip ci]" || echo "No changes to commit"
        git push || echo "No changes to push"
    
    # Build Discord Bot
    - name: Build Discord Bot image
      run: |
        docker build \
          --file services/discord-bot/Dockerfile \
          --tag $DISCORD_BOT_IMAGE_NAME \
          --label "version=${{ steps.increment-version.outputs.NEW_VERSION }}" \
          --label "runnumber=${GITHUB_RUN_ID}" \
          services/discord-bot
    
    # Build Backend
    - name: Build Backend image
      run: |
        docker build \
          --file services/backend/Dockerfile \
          --tag $BACKEND_IMAGE_NAME \
          --label "version=${{ steps.increment-version.outputs.NEW_VERSION }}" \
          --label "runnumber=${GITHUB_RUN_ID}" \
          services/backend
    
    - name: Log in to registry
      run: |
        echo "${{ secrets.FBFBUDDYBACKEND_REGISTRY_PASSWORD }}" |
          docker login "$ACR_NAME.azurecr.io" \
            --username "${{ secrets.FBFBUDDYBACKEND_REGISTRY_USERNAME }}" \
            --password-stdin

    # Push Discord Bot
    - name: Push Discord Bot image
      id: push-discord-bot
      env: 
        VERSION: ${{ steps.increment-version.outputs.NEW_VERSION }}
      run: |
        IMAGE_ID=$ACR_NAME.azurecr.io/$DISCORD_BOT_IMAGE_NAME

        echo "IMAGE_ID=$IMAGE_ID" >> $GITHUB_OUTPUT
        docker tag $DISCORD_BOT_IMAGE_NAME $IMAGE_ID:$VERSION
        docker tag $DISCORD_BOT_IMAGE_NAME $IMAGE_ID:latest
        docker push $IMAGE_ID:$VERSION
        docker push $IMAGE_ID:latest

    # Push Backend
    - name: Push Backend image
      id: push-backend
      env: 
        VERSION: ${{ steps.increment-version.outputs.NEW_VERSION }}
      run: |
        IMAGE_ID=$ACR_NAME.azurecr.io/$BACKEND_IMAGE_NAME

        echo "IMAGE_ID=$IMAGE_ID" >> $GITHUB_OUTPUT
        docker tag $BACKEND_IMAGE_NAME $IMAGE_ID:$VERSION
        docker tag $BACKEND_IMAGE_NAME $IMAGE_ID:latest
        docker push $IMAGE_ID:$VERSION
        docker push $IMAGE_ID:latest

  create-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: checkout 
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Create Release
      uses: elgohr/Github-Release-Action@v5
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        title: ${{ needs.build.outputs.version }}
        tag: ${{ needs.build.outputs.version }}
        
  deploy-backend:
    needs: [build, create-release]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
    - name: Azure login for backend
      uses: azure/login@v3
      with:
        client-id: ${{ secrets.FBFBUDDYBACKEND_AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.FBFBUDDYBACKEND_AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.FBFBUDDYBACKEND_AZURE_SUBSCRIPTION_ID }}
    
    - name: Deploy backend to App Service
      env:
        BACKEND_IMAGE: ${{ needs.build.outputs.backend-image }}:latest
      run: |
        SUBSCRIPTION_ID=$(az account show --query id --output tsv)
        IDENTITY_CLIENT_ID=$(az identity show \
          --resource-group "$RESOURCE_GROUP" \
          --name "$IDENTITY_NAME" \
          --query clientId \
          --output tsv)

        BODY=$(jq -n \
          --arg image "$BACKEND_IMAGE" \
          --arg identityClientId "$IDENTITY_CLIENT_ID" \
          '{
            properties: {
              image: $image,
              isMain: true,
              targetPort: "3000",
              authType: "UserAssigned",
              userManagedIdentityClientId: $identityClientId,
              inheritAppSettingsAndConnectionStrings: true
            }
          }')
        az rest \
          --method put \
          --url "https://management.azure.com/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.Web/sites/$BACKEND_APP/sitecontainers/main?api-version=2024-11-01" \
          --body "$BODY" \
          --output none
        az webapp log config \
          --resource-group "$RESOURCE_GROUP" \
          --name "$BACKEND_APP" \
          --docker-container-logging filesystem

        HOST_NAME=$(az webapp show \
          --resource-group "$RESOURCE_GROUP" \
          --name "$BACKEND_APP" \
          --query defaultHostName \
          --output tsv)
        sleep 30
        for attempt in {1..30}; do
          if curl --fail --silent --show-error "https://$HOST_NAME/ready"; then
            exit 0
          fi
          echo "Waiting for $BACKEND_APP to become ready (attempt $attempt/30)"
          sleep 10
        done
        exit 1

  deploy-discord-bot:
    needs: [build, create-release]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
    - name: Azure login for Discord bot
      uses: azure/login@v3
      with:
        client-id: ${{ secrets.FBFBUDDYDISCORDBOT_AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.FBFBUDDYDISCORDBOT_AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.FBFBUDDYDISCORDBOT_AZURE_SUBSCRIPTION_ID }}

    - name: Deploy Discord bot to App Service
      env:
        DISCORD_BOT_IMAGE: ${{ needs.build.outputs.discord-bot-image }}:latest
      run: |
        SUBSCRIPTION_ID=$(az account show --query id --output tsv)
        IDENTITY_CLIENT_ID=$(az identity show \
          --resource-group "$RESOURCE_GROUP" \
          --name "$IDENTITY_NAME" \
          --query clientId \
          --output tsv)
        BODY=$(jq -n \
          --arg image "$DISCORD_BOT_IMAGE" \
          --arg identityClientId "$IDENTITY_CLIENT_ID" \
          '{
            properties: {
              image: $image,
              isMain: true,
              targetPort: "3001",
              authType: "UserAssigned",
              userManagedIdentityClientId: $identityClientId,
              inheritAppSettingsAndConnectionStrings: true
            }
          }')
        az rest \
          --method put \
          --url "https://management.azure.com/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.Web/sites/$DISCORD_BOT_APP/sitecontainers/discord-buddy?api-version=2024-11-01" \
          --body "$BODY" \
          --output none
        az webapp log config \
          --resource-group "$RESOURCE_GROUP" \
          --name "$DISCORD_BOT_APP" \
          --docker-container-logging filesystem

        HOST_NAME=$(az webapp show \
          --resource-group "$RESOURCE_GROUP" \
          --name "$DISCORD_BOT_APP" \
          --query defaultHostName \
          --output tsv)
        sleep 30
        for attempt in {1..30}; do
          if curl --fail --silent --show-error "https://$HOST_NAME/ready"; then
            exit 0
          fi
          echo "Waiting for $DISCORD_BOT_APP to become ready (attempt $attempt/30)"
          sleep 10
        done
        exit 1
